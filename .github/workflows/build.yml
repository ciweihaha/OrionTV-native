name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest 自带 Android SDK（ANDROID_HOME 已设置），不再用
      # android-actions/setup-android（该 Action 在 2026-11-14 的 run 43571581939
      # 里 11 秒即失败）；只确保 platform 34 与 build-tools 34.0.0 已装。
      - name: Ensure Android SDK components
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"
          else
            echo "sdkmanager not found at $SDKMANAGER; relying on preinstalled SDK"
            ls "$ANDROID_HOME/platforms" || true
          fi

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v3

      - name: Build debug APK and run unit tests
        run: |
          ./gradlew assembleDebug testDebugUnitTest --stacktrace > gradle-build.log 2>&1 || BUILD_FAILED=1
          if [ "${BUILD_FAILED:-0}" = "1" ]; then
            # 日志文件只能在 Actions 界面下载；把关键错误行打成 check-run 注解，
            # 这样不用进界面也能从 API 读到失败原因（见注解）。
            # Gradle 的错误详情以 "> " 开头，异常原因以 "Caused by:" 开头。
            { grep -E "^e: |FAILURE: Build failed|What went wrong|Execution failed for task|^> |^Caused by:|There were failing tests" gradle-build.log | head -10 || true; } | sed 's/%/%25/g' | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::$line"
            done
            exit 1
          fi

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log
          retention-days: 7

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: oriontv-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
