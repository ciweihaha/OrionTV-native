name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # 恢复后的仓库从未跑过 Build（push 事件未触发）；没有 push 时可手动跑。
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest 自带 Android SDK（ANDROID_HOME 已设置），不再用
      # android-actions/setup-android（该 Action 在 2026-11-14 的 run 43571581939
      # 里 11 秒即失败）；只确保 platform 35 与 build-tools 35.0.0 已装
      #（compileSdk 35，见 app/build.gradle.kts 注释）。
      - name: Ensure Android SDK components
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          else
            echo "sdkmanager not found at $SDKMANAGER; relying on preinstalled SDK"
            ls "$ANDROID_HOME/platforms" || true
          fi

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v3

      - name: Build debug APK and run unit tests
        run: |
          ./gradlew assembleDebug testDebugUnitTest --stacktrace > gradle-build.log 2>&1 || BUILD_FAILED=1
          if [ "${BUILD_FAILED:-0}" = "1" ]; then
            # 日志文件只能在 Actions 界面下载；把关键错误行打成 check-run 注解，
            # 这样不用进界面也能从 API 读到失败原因（见注解）。
            # 注解每步上限 10 条：优先发 Kotlin 编译错误（e: 行），没有才发 FAILURE 段。
            ERROR_LINES=$(grep -E "^e: " gradle-build.log | head -10 || true)
            if [ -n "$ERROR_LINES" ]; then
              echo "$ERROR_LINES" | sed 's/%/%25/g' | while IFS= read -r line; do
                [ -n "$line" ] && echo "::error::$line"
              done
            else
              awk '/FAILURE: Build failed/{found=1} found{print} found && ++n>=10{exit}' gradle-build.log | sed 's/%/%25/g' | while IFS= read -r line; do
                [ -n "$line" ] && echo "::error::$line"
              done
            fi
            exit 1
          fi

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log
          retention-days: 7

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: oriontv-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

# 2026-11-14 注：仓库误删后由用户在 GitHub 恢复；此次提交用于重新注册工作流。
