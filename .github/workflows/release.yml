name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v3

      - name: Decode release keystore
        if: env.ORION_KEYSTORE_BASE64 != ''
        env:
          ORION_KEYSTORE_BASE64: ${{ secrets.ORION_KEYSTORE_BASE64 }}
        run: |
          echo "$ORION_KEYSTORE_BASE64" | base64 -d > /tmp/oriontv-release.keystore
          echo "ORION_KEYSTORE_FILE=/tmp/oriontv-release.keystore" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          ORION_KEYSTORE_PASSWORD: ${{ secrets.ORION_KEYSTORE_PASSWORD }}
          ORION_KEY_ALIAS: ${{ secrets.ORION_KEY_ALIAS }}
          ORION_KEY_PASSWORD: ${{ secrets.ORION_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Check APK size
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          SIZE=$(stat -c%s "$APK")
          echo "APK: $APK ($SIZE bytes)"
          # 目标 < 25MB；超过 30MB 直接失败
          if [ "$SIZE" -gt 31457280 ]; then
            echo "::error::APK too large: $SIZE bytes (> 30MB)"
            exit 1
          fi

      - name: Generate SHA-256
        run: |
          cd app/build/outputs/apk/release
          for f in *.apk; do sha256sum "$f" > "$f.sha256"; done
          ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/*.apk.sha256
          generate_release_notes: true
