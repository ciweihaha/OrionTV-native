name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Secret 必须放 job 级 env，step 的 if: env.X 才能读到
    #（step 自身 env 在 if 求值时不可见；GitHub 文档推荐的 secrets 用法）。
    env:
      ORION_KEYSTORE_BASE64: ${{ secrets.ORION_KEYSTORE_BASE64 }}
    steps:
      # C4-P2-9：发版守卫要查 tag 历史（上一版 versionCode/证书指纹），必须拉全量历史。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest 自带 Android SDK（ANDROID_HOME 已设置），不再用
      # android-actions/setup-android（该 Action 在 2026-11-14 的 run 43571581939
      # 里 11 秒即失败）；只确保 platform 35 与 build-tools 35.0.0 已装
      #（compileSdk 35，见 app/build.gradle.kts 注释）。
      - name: Ensure Android SDK components
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          else
            echo "sdkmanager not found at $SDKMANAGER; relying on preinstalled SDK"
            ls "$ANDROID_HOME/platforms" || true
          fi

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v3

      # C4-P2-9：发版守卫——tag 必须打在 main 分支上（任意分支打 v* 即发版已堵住）。
      - name: Verify tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $GITHUB_REF_NAME is not on main — releases only ship from main"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME is on main"

      # C4-P1-9：tag 与版本一致性校验（本轮只加校验，不改 versionName/versionCode，
      # 发版时先改 gradle 版本号再打 tag）。
      # tag（去 v 前缀）必须等于 versionName；versionCode 必须大于上一版 v* tag。
      - name: Verify tag matches version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION_NAME=$(grep -E 'versionName *= *"' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          VERSION_CODE=$(grep -E 'versionCode *= *[0-9]+' app/build.gradle.kts | head -n 1 | grep -oE '[0-9]+')
          echo "tag=$TAG versionName=$VERSION_NAME versionCode=$VERSION_CODE"
          if [ "$TAG" != "$VERSION_NAME" ]; then
            echo "::error::tag v$TAG does not match versionName $VERSION_NAME — bump app/build.gradle.kts first"
            exit 1
          fi
          PREV_TAG=$(git tag --sort=-v:refname | grep -E '^v' | grep -v "^v$TAG$" | head -n 1 || true)
          if [ -n "$PREV_TAG" ]; then
            PREV_CODE=$(git show "$PREV_TAG:app/build.gradle.kts" | grep -E 'versionCode *= *[0-9]+' | head -n 1 | grep -oE '[0-9]+')
            echo "previous tag=$PREV_TAG versionCode=$PREV_CODE"
            if [ -n "$PREV_CODE" ] && [ "$VERSION_CODE" -le "$PREV_CODE" ]; then
              echo "::error::versionCode $VERSION_CODE is not greater than previous $PREV_CODE ($PREV_TAG)"
              exit 1
            fi
          else
            echo "no previous v* tag, skipping versionCode check"
          fi

      # C4-P1-9：发版前跑单测（之前 release.yml 不跑单测，坏测试也能发版）。
      # C6-P2-3：debug 与 release 单测都跑——只跑 testDebugUnitTest 时，
      # release 变体独有的代码（BuildConfig/混淆相关分支）从没被测过。
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest testReleaseUnitTest --stacktrace

      # C4-P2-11：lint 进 CI；release 开了 minify，mapping 随包上传（见文末）。
      - name: Lint release
        run: ./gradlew lintRelease --stacktrace

      - name: Decode release keystore
        if: env.ORION_KEYSTORE_BASE64 != ''
        run: |
          echo "$ORION_KEYSTORE_BASE64" | base64 -d > /tmp/oriontv-release.keystore
          echo "ORION_KEYSTORE_FILE=/tmp/oriontv-release.keystore" >> "$GITHUB_ENV"

      # 防呆：v2.0.0 首版就是在这里静默漏签的（Build 步骤漏传
      # ORION_KEYSTORE_BASE64，signingConfig 为空却照常出包）。
      # 密钥文件不存在或为空时直接失败，绝不放行一个未签名 APK。
      - name: Verify keystore decoded
        run: |
          if [ ! -s /tmp/oriontv-release.keystore ]; then
            echo "::error::release keystore missing or empty — check ORION_KEYSTORE_BASE64 secret"
            exit 1
          fi
          echo "keystore present: $(stat -c%s /tmp/oriontv-release.keystore) bytes"

      - name: Build release APK
        env:
          ORION_KEYSTORE_BASE64: ${{ secrets.ORION_KEYSTORE_BASE64 }}
          ORION_KEYSTORE_PASSWORD: ${{ secrets.ORION_KEYSTORE_PASSWORD }}
          ORION_KEY_ALIAS: ${{ secrets.ORION_KEY_ALIAS }}
          ORION_KEY_PASSWORD: ${{ secrets.ORION_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      # 验签：只有 v2/v3 签名通过才放行，避免未签名 APK 再次进 Release。
      - name: Verify APK signature
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"

      # C4-P2-9：签名证书指纹必须与上一版 Release 的 APK 一致（换证书=换签名，
      # 旧用户无法覆盖安装）；没有上一版时跳过。
      - name: Verify signing cert matches previous release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          CURRENT_FP=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | grep -i "SHA-256 digest" | head -n 1 | sed 's/.*: //')
          echo "current cert SHA-256: $CURRENT_FP"
          # C6-P2-2：按最高版本 tag 取上一版，不按“最新创建的 Release”——
          # 补发旧版 hotfix Release 会比新版晚创建，旧实现会拿错上一版比对指纹。
          # C8-P2-4：--limit 50 在超 50 个 Release 时会漏掉老版本，拉全量。
          PREV_TAG=$(gh release list --limit 1000 --json tagName --jq -r '.[].tagName' | sed 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          if [ -n "$PREV_TAG" ]; then PREV_TAG="v$PREV_TAG"; fi
          if [ -z "$PREV_TAG" ] || [ "$PREV_TAG" = "null" ]; then
            echo "no previous release, skipping cert check"
            exit 0
          fi
          echo "previous release: $PREV_TAG"
          rm -rf /tmp/prev-release && mkdir -p /tmp/prev-release
          gh release download "$PREV_TAG" --pattern '*.apk' --dir /tmp/prev-release
          # C8-P2-4：单 Release 多 APK 时旧实现 head -n 1 任意取一个，可能比错；
          # 按版本排序确定性取最新，多于一个时告警（仍取最新继续比对）。
          PREV_COUNT=$(ls /tmp/prev-release/*.apk 2>/dev/null | wc -l)
          if [ "$PREV_COUNT" -gt 1 ]; then
            echo "::warning::previous release $PREV_TAG has $PREV_COUNT APKs, using latest by version"
          fi
          PREV_APK=$(ls /tmp/prev-release/*.apk | sort -V | tail -n 1)
          PREV_FP=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$PREV_APK" | grep -i "SHA-256 digest" | head -n 1 | sed 's/.*: //')
          echo "previous cert SHA-256: $PREV_FP"
          if [ "$CURRENT_FP" != "$PREV_FP" ]; then
            echo "::error::signing certificate changed vs $PREV_TAG — same keystore required for upgrades"
            exit 1
          fi

      - name: Check APK size
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          SIZE=$(stat -c%s "$APK")
          echo "APK: $APK ($SIZE bytes)"
          # 目标 < 25MB；超过 30MB 直接失败
          if [ "$SIZE" -gt 31457280 ]; then
            echo "::error::APK too large: $SIZE bytes (> 30MB)"
            exit 1
          fi

      - name: Generate SHA-256
        run: |
          cd app/build/outputs/apk/release
          for f in *.apk; do sha256sum "$f" > "$f.sha256"; done
          ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/*.apk.sha256
            app/build/outputs/mapping/release/mapping.txt
          generate_release_notes: true
