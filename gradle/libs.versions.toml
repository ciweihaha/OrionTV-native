[versions]
gradle = "8.11.1"
agp = "8.7.3"
kotlin = "2.0.21"
ksp = "2.0.21-1.0.28"
composeBom = "2024.10.01"
tvMaterial = "1.0.1"
hiltNavigationCompose = "1.2.0"
navigationCompose = "2.8.0"
lifecycle = "2.8.7"
media3 = "1.4.1"
okhttp = "4.12.1"
serialization = "1.7.3"
coil3 = "3.0.4"
room = "2.6.1"
datastore = "1.1.1"
hilt = "2.52"
coroutines = "1.9.0"
nanohttpd = "2.3.1"
zxing = "3.5.3"
securityCrypto = "1.1.0-alpha06"
junit = "4.13.2"
mockk = "1.13.13"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version = "1.15.0" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version = "1.9.3" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
# Compose foundation（含标准 LazyColumn/LazyRow/LazyVerticalGrid）：
# tv-foundation 1.0.0 已删掉 Tv Lazy Layout（alpha11 弃用、alpha12 移除），
# 官方版本要求改用标准 lazy 布局；版本由 BOM 管理（不写 version）。
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
# 导航轨图标：LiveTv 只在 extended 里，core 没有；版本由 Compose BOM 管理（不写 version）。
# extended 依赖 core，所以 Home/Search/Favorite/Settings 也能用。
androidx-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
# tv-foundation 只剩 ExperimentalTvFoundationApi 与 text 工具，无 lazy 布局；
# 本工程不再直接依赖它（tv-material 1.0.1 也不依赖它），故不声明。
androidx-tv-material = { group = "androidx.tv", name = "tv-material", version.ref = "tvMaterial" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
media3-common = { group = "androidx.media3", name = "media3-common", version.ref = "media3" }
media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
coil3-compose = { group = "io.coil-kt.coil3", name = "coil-compose-android", version.ref = "coil3" }
# AsyncImage 在 core-android 里（包名是 coil3.compose，没有 io 前缀）
coil3-compose-core-android = { group = "io.coil-kt.coil3", name = "coil-compose-core-android", version.ref = "coil3" }
# Coil 3 核心默认不加载网络图，必须显式加网络 fetcher（骨架删掉它是错的，
# 删了之后所有远程海报都加载不出来）；httpHeaders 扩展也在 network-core 里。
coil3-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil3" }
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
# hiltViewModel() 在此 artifact（骨架第一版漏声明，导致编译失败）
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
nanohttpd = { group = "org.nanohttpd", name = "nanohttpd", version.ref = "nanohttpd" }
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxing" }
# 登录凭据安全存储（EncryptedSharedPreferences / Keystore），绝不明文落盘
security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "securityCrypto" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
room = { id = "androidx.room", version.ref = "room" }
